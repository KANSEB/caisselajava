<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Caisse Bar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: Arial, sans-serif; }
  :root {
    --bg: #111; --surface: #1e1e1e; --surface2: #2a2a2a; --border: #333;
    --accent: #c8ff00; --text: #fff; --muted: #888;
    --danger: #ff4040; --success: #00cc88; --consigne: #4a90e2;
  }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* HEADER */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .header-title { font-size: 18px; font-weight: 900; letter-spacing: 1px; }
  .header-title span { color: var(--accent); }
  .btn-config { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

  /* TICKET */
  .ticket { background: var(--surface); margin: 10px 12px 0; border-radius: 10px; border: 1px solid var(--border); flex-shrink: 0; }
  .ticket-items { max-height: 110px; overflow-y: auto; padding: 6px; }
  .ticket-item { display: flex; align-items: center; padding: 6px 8px; border-radius: 6px; margin-bottom: 3px; background: var(--surface2); font-size: 14px; }
  .ticket-item-name { flex: 1; font-weight: 600; }
  .ticket-item-qty { background: var(--accent); color: #000; font-weight: 900; width: 24px; height: 24px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 13px; margin: 0 8px; flex-shrink: 0; }
  .ticket-item-price { color: var(--accent); font-weight: 700; min-width: 58px; text-align: right; font-size: 14px; flex-shrink: 0; }
  .ticket-item-del { background: none; border: none; color: var(--danger); cursor: pointer; padding: 2px 6px; font-size: 16px; flex-shrink: 0; }
  .ticket-empty { padding: 14px; text-align: center; color: var(--muted); font-size: 13px; }
  .total-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-top: 1px solid var(--border); }
  .total-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .total-amount { font-size: 32px; font-weight: 900; color: var(--accent); }

  /* GRILLE */
  .grid-wrap { flex: 1; overflow-y: auto; padding: 10px 12px 4px; display: flex; flex-direction: column; gap: 10px; }
  .section { display: flex; flex-direction: column; gap: 5px; }
  .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding-left: 2px; }
  .section-row { display: grid; gap: 6px; }
  .cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .cols-2 { grid-template-columns: 1fr 1fr; }

  /* BOUTONS PRODUITS */
  .prod-btn { background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 12px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 72px; transition: transform 0.08s; }
  .prod-btn:active { transform: scale(0.93); background: var(--surface2); }
  .prod-name  { font-size: 15px; font-weight: 900; color: var(--text); text-align: center; }
  .prod-sub   { font-size: 11px; color: var(--muted); font-weight: 600; }
  .prod-price { font-size: 18px; font-weight: 900; color: var(--accent); }

  /* Couleurs bières */
  .blonde  { border-color: #c8a020; }
  .blonde  .prod-name { color: #f5c842; }
  .blanche { border-color: #7ab8d4; }
  .blanche .prod-name { color: #a0d8ef; }
  .ipa     { border-color: #c85020; }
  .ipa     .prod-name { color: #ff8050; }
  .consigne { border-color: var(--consigne); }
  .consigne .prod-price { color: var(--consigne); }

  /* ACTIONS */
  .actions { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; padding: 10px 12px; flex-shrink: 0; }
  .btn-action { padding: 14px 8px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; transition: transform 0.1s; text-align: center; }
  .btn-action:active { transform: scale(0.97); }
  .btn-clear  { background: var(--surface2); color: var(--danger); border: 2px solid var(--danger); }
  .btn-remove { background: var(--surface2); color: var(--muted); border: 2px solid var(--border); }
  .btn-pay    { background: var(--accent); color: #000; font-size: 17px; font-weight: 900; }

  /* MODALS */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--surface); border-radius: 16px 16px 0 0; border-top: 1px solid var(--border); padding: 16px; width: 100%; max-height: 80vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.2s; }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modal-title { font-size: 17px; font-weight: 900; }
  .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }

  .config-section { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 12px 0 6px; }
  .config-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--surface2); border-radius: 8px; margin-bottom: 5px; }
  .config-name { flex: 1; font-size: 14px; font-weight: 600; }
  .config-price-input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--accent); font-size: 15px; font-weight: 700; padding: 6px 10px; width: 72px; text-align: right; }
  .config-price-input:focus { outline: none; border-color: var(--accent); }

  .pay-total { font-size: 48px; font-weight: 900; color: var(--accent); text-align: center; margin: 14px 0; }
  .pay-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .pay-method { padding: 20px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface2); font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; transition: all 0.15s; }
  .pay-method.selected { border-color: var(--accent); color: var(--accent); }
  .pay-method-icon { font-size: 28px; display: block; margin-bottom: 6px; }
  .btn-confirm { width: 100%; padding: 17px; background: var(--success); border: none; border-radius: 10px; font-size: 18px; font-weight: 900; color: #000; cursor: pointer; display: none; }
  .btn-confirm.show { display: block; }

  .flash { position: fixed; inset: 0; background: var(--success); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .flash.show { opacity: 1; }
  .flash-icon { font-size: 80px; }
  .flash-text { font-size: 26px; font-weight: 900; color: #000; margin-top: 12px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">BAR <span>LA JAVA</span></div>
  <button class="btn-config" id="btnConfig">⚙ PRIX</button>
</div>

<div class="ticket">
  <div class="ticket-items" id="ticketItems">
    <div class="ticket-empty">Aucun article</div>
  </div>
  <div class="total-bar">
    <div class="total-label">Total</div>
    <div class="total-amount" id="totalAmount">0,00 €</div>
  </div>
</div>

<div class="grid-wrap" id="gridWrap"></div>

<div class="actions">
  <button class="btn-action btn-clear"  id="btnClear">✕ Vider</button>
  <button class="btn-action btn-remove" id="btnRemove">← Retirer</button>
  <button class="btn-action btn-pay"    id="btnPay">ENCAISSER</button>
</div>

<!-- CONFIG -->
<div class="modal-overlay" id="configModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Modifier les prix</div>
      <button class="btn-close" id="closeConfig">✕</button>
    </div>
    <div id="configItems"></div>
  </div>
</div>

<!-- PAIEMENT -->
<div class="modal-overlay" id="payModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Encaissement</div>
      <button class="btn-close" id="closePay">✕</button>
    </div>
    <div class="pay-total" id="payTotal"></div>
    <div class="pay-methods">
      <div class="pay-method" data-method="cash"><span class="pay-method-icon">💵</span>Espèces</div>
      <div class="pay-method" data-method="card"><span class="pay-method-icon">💳</span>Carte</div>
    </div>
    <button class="btn-confirm" id="btnConfirm">✓ VALIDER</button>
  </div>
</div>

<div class="flash" id="flash">
  <div class="flash-icon">✓</div>
  <div class="flash-text">ENCAISSÉ</div>
</div>

<script>
const DEFAULTS = [
  { id:'blonde_d',  name:'Blonde',  sub:'Demi',  price:3.50, cat:'biere', style:'blonde'   },
  { id:'blanche_d', name:'Blanche', sub:'Demi',  price:4.50, cat:'biere', style:'blanche'  },
  { id:'ipa_d',     name:'IPA',     sub:'Demi',  price:5.50, cat:'biere', style:'ipa'      },
  { id:'blonde_p',  name:'Blonde',  sub:'Pinte', price:6.00, cat:'biere', style:'blonde'   },
  { id:'blanche_p', name:'Blanche', sub:'Pinte', price:7.00, cat:'biere', style:'blanche'  },
  { id:'ipa_p',     name:'IPA',     sub:'Pinte', price:8.00, cat:'biere', style:'ipa'      },
  { id:'rouge_25',  name:'Rouge',   sub:'25cl',  price:5.00, cat:'vin',   style:''         },
  { id:'blanc_25',  name:'Blanc',   sub:'25cl',  price:5.00, cat:'vin',   style:''         },
  { id:'rose_25',   name:'Rosé',    sub:'25cl',  price:5.00, cat:'vin',   style:''         },
  { id:'rouge_50',  name:'Rouge',   sub:'50cl',  price:9.00, cat:'vin',   style:''         },
  { id:'blanc_50',  name:'Blanc',   sub:'50cl',  price:9.00, cat:'vin',   style:''         },
  { id:'rose_50',   name:'Rosé',    sub:'50cl',  price:9.00, cat:'vin',   style:''         },
  { id:'coca',      name:'Coca',    sub:'',      price:3.00, cat:'soft',  style:''         },
  { id:'jus',       name:'Jus O.',  sub:'',      price:3.00, cat:'soft',  style:''         },
  { id:'icetea',    name:'Ice Tea', sub:'',      price:3.00, cat:'soft',  style:''         },
  { id:'cons',      name:'Écocup', sub:'Consigne', price:1.00, cat:'cons', style:'consigne'},
];

function load() { try { const s=localStorage.getItem('lj4'); return s?JSON.parse(s):DEFAULTS; } catch { return JSON.parse(JSON.stringify(DEFAULTS)); } }
function save() { localStorage.setItem('lj4', JSON.stringify(products)); }

let products = load();
let cart = [];

function renderGrid() {
  const demis   = products.filter(p=>p.cat==='biere'&&p.sub==='Demi');
  const pintes  = products.filter(p=>p.cat==='biere'&&p.sub==='Pinte');
  const vins25  = products.filter(p=>p.cat==='vin'  &&p.sub==='25cl');
  const vins50  = products.filter(p=>p.cat==='vin'  &&p.sub==='50cl');
  const softs   = products.filter(p=>p.cat==='soft');
  const cons    = products.filter(p=>p.cat==='cons');

  document.getElementById('gridWrap').innerHTML = `
    <div class="section">
      <div class="section-title">🍺 Bières — Demi</div>
      <div class="section-row cols-3">${demis.map(btn).join('')}</div>
    </div>
    <div class="section">
      <div class="section-title">🍺 Bières — Pinte</div>
      <div class="section-row cols-3">${pintes.map(btn).join('')}</div>
    </div>
    <div class="section">
      <div class="section-title">🍷 Vins — 25cl</div>
      <div class="section-row cols-3">${vins25.map(btn).join('')}</div>
    </div>
    <div class="section">
      <div class="section-title">🍷 Vins — 50cl</div>
      <div class="section-row cols-3">${vins50.map(btn).join('')}</div>
    </div>
    <div class="section">
      <div class="section-title">🥤 Softs</div>
      <div class="section-row cols-3">${softs.map(btn).join('')}</div>
    </div>
    <div class="section">
      <div class="section-title">🪙 Consigne</div>
      <div class="section-row cols-2">${cons.map(btn).join('')}</div>
    </div>
  `;
  document.querySelectorAll('.prod-btn').forEach(b=>b.addEventListener('click',()=>addItem(b.dataset.id)));
}

function btn(p) {
  return `<button class="prod-btn ${p.style}" data-id="${p.id}">
    <span class="prod-name">${p.name}</span>
    ${p.sub?`<span class="prod-sub">${p.sub}</span>`:''}
    <span class="prod-price">${fmt(p.price)}</span>
  </button>`;
}

function addItem(id) {
  const p=products.find(x=>x.id===id); if(!p) return;
  const ex=cart.find(x=>x.id===id);
  if(ex) ex.qty++; else cart.push({...p,qty:1});
  renderCart();
}
function removeLast() {
  if(!cart.length) return;
  const last=cart[cart.length-1]; last.qty--;
  if(last.qty<=0) cart.pop(); renderCart();
}
function removeItem(id) { cart=cart.filter(x=>x.id!==id); renderCart(); }
function clearCart()    { cart=[]; renderCart(); }
function total()        { return cart.reduce((s,i)=>s+i.price*i.qty,0); }

function renderCart() {
  const el=document.getElementById('ticketItems');
  if(!cart.length) { el.innerHTML='<div class="ticket-empty">Aucun article</div>'; }
  else {
    el.innerHTML=cart.map(i=>`
      <div class="ticket-item">
        <span class="ticket-item-name">${i.name}${i.sub?' – '+i.sub:''}</span>
        <span class="ticket-item-qty">${i.qty}</span>
        <span class="ticket-item-price">${fmt(i.price*i.qty)}</span>
        <button class="ticket-item-del" data-id="${i.id}">✕</button>
      </div>`).join('');
    el.querySelectorAll('.ticket-item-del').forEach(b=>b.addEventListener('click',()=>removeItem(b.dataset.id)));
    el.scrollTop=el.scrollHeight;
  }
  document.getElementById('totalAmount').textContent=fmt(total());
}

function renderConfig() {
  const cats=[{key:'biere',label:'Bières'},{key:'vin',label:'Vins'},{key:'soft',label:'Softs'},{key:'cons',label:'Consigne'}];
  document.getElementById('configItems').innerHTML=cats.map(c=>{
    const items=products.filter(p=>p.cat===c.key);
    return `<div class="config-section">${c.label}</div>`+items.map(p=>{
      const idx=products.indexOf(p);
      return `<div class="config-item">
        <span class="config-name">${p.name}${p.sub?' – '+p.sub:''}</span>
        <input class="config-price-input" type="number" step="0.5" min="0" value="${p.price.toFixed(2)}" data-idx="${idx}">
      </div>`;
    }).join('');
  }).join('');
  document.querySelectorAll('.config-price-input').forEach(inp=>{
    inp.addEventListener('change',()=>{
      const v=parseFloat(inp.value); if(!isNaN(v)&&v>=0){products[+inp.dataset.idx].price=v; save(); renderGrid();}
    });
  });
}

function fmt(n) { return n.toFixed(2).replace('.',',')+' €'; }

renderGrid(); renderCart();

document.getElementById('btnClear').addEventListener('click',clearCart);
document.getElementById('btnRemove').addEventListener('click',removeLast);
document.getElementById('btnConfig').addEventListener('click',()=>{ renderConfig(); document.getElementById('configModal').classList.add('open'); });
document.getElementById('closeConfig').addEventListener('click',()=>document.getElementById('configModal').classList.remove('open'));
document.getElementById('closePay').addEventListener('click',()=>document.getElementById('payModal').classList.remove('open'));
document.getElementById('btnPay').addEventListener('click',()=>{
  if(total()===0) return;
  document.getElementById('payTotal').textContent=fmt(total());
  document.getElementById('btnConfirm').classList.remove('show');
  document.querySelectorAll('.pay-method').forEach(m=>m.classList.remove('selected'));
  document.getElementById('payModal').classList.add('open');
});
document.querySelectorAll('.pay-method').forEach(m=>m.addEventListener('click',()=>{
  document.querySelectorAll('.pay-method').forEach(x=>x.classList.remove('selected'));
  m.classList.add('selected');
  document.getElementById('btnConfirm').classList.add('show');
}));
document.getElementById('btnConfirm').addEventListener('click',()=>{
  document.getElementById('payModal').classList.remove('open');
  const f=document.getElementById('flash'); f.classList.add('show');
  setTimeout(()=>{ f.classList.remove('show'); clearCart(); },900);
});
</script>
</body>
</html>
